[workspace]
resolver = "2"
members = [
    "crates/vestige-core",
    "crates/vestige-spacetime",
    "crates/vestige-mcp",
    "crates/strata",
    "crates/strata-kernel",
    "crates/strata-gate",
    "crates/strata-store",
    "tests/e2e",
    "tests/phase_1",
    "tests/differential",
]
exclude = [
    "fastembed-rs",
    # strata-migrate stays OUT of the workspace on purpose: its acceptance
    # tests verify the v3 guard through its OWN vestige-core build. Joining
    # it would let cargo feature unification (tests/e2e requests v3-engine)
    # disable the guard in unified builds — loosening a guard to make a
    # build pass (H8). strata-verify remains excluded until it is mergeable.
    "crates/strata-migrate",
    "crates/strata-verify",
]

[workspace.package]
version = "3.1.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/samvallad33/vestige"
authors = ["Sam Valladares"]

[workspace.dependencies]
# Share deps across workspace
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
ed25519-dalek = "3"
libm = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1
