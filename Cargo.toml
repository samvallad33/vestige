[workspace]
resolver = "2"
members = [
    "crates/vestige-lexicons",
    "crates/vestige-core",
    "crates/vestige-hook",
    "crates/vestige-mcp",
    "crates/vestige-proof",
    "crates/vestige-upgrade",
    "crates/strata",
    "crates/strata-causal-math",
    "crates/strata-crypto",
    "crates/strata-episodic",
    "crates/strata-gate",
    "crates/strata-import",
    "crates/strata-kernel",
    "crates/strata-mesh",
    "crates/strata-migrate",
    "crates/strata-passport",
    "crates/strata-runtime",
    "crates/strata-simd",
    "crates/strata-store",
    "crates/strata-verify",
]

[workspace.package]
version = "7.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/samvallad33/vestige"
authors = ["Sam Valladares"]

[workspace.dependencies]
# Share deps across workspace (surgical tokio features; zero `full` bloat)
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
blake3 = "1.8.8"
sha2 = "0.11.2"
base64 = "0.23"
rapidhash = "4.5"
mimalloc = "0.1.52"
daachorse = "5.1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

# Fat LTO shipping profile for CI release artifacts when binary size is prioritized.
[profile.dist]
inherits = "release"
lto = "fat"
opt-level = "z"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

# Local benchmarking only: fast to build, fast to run. `release` stays the shipping profile.
[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
incremental = true
strip = false
