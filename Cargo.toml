[workspace]
resolver = "2"
members = [
    "crates/vestige-core",
    "crates/vestige-spacetime",
    "crates/vestige-mcp",
    "crates/vestige-upgrade",
    "tests/e2e",
    "tests/phase_1",
    "tests/differential",
]
exclude = [
    "fastembed-rs",
    # Strata Causal Proof Engine crates: standalone with empty [workspace]
    # tables by design (parallel-agent construction). Excluded so root members
    # can path-depend without cargo seeing multiple workspace roots;
    # re-parent deliberately at integration time.
    "crates/strata",
    "crates/strata-gate",
    "crates/strata-kernel",
    "crates/strata-migrate",
    "crates/strata-store",
    "crates/strata-verify",
    "crates/strata-backtest",

]

[workspace.package]
version = "4.1.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/samvallad33/vestige"
authors = ["Sam Valladares"]

[workspace.dependencies]
# Share deps across workspace
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
opt-level = 1
