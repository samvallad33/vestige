name: CI

on:
  push:
    branches:
      - main
      - v4
      - release/v4.0.0-rc
      # Upper layers of the Mattar–Daw stack. A push workflow uses the file
      # on the branch being pushed, so these runs attach to the PR head.
      - cursor/strata-backtest-need-a5ba
      - cursor/strata-backtest-evb-a5ba
  pull_request:
    branches:
      - main
      - v4
      - release/v4.0.0-rc
      - cursor/strata-backtest-floor-a5ba
      - cursor/strata-backtest-need-a5ba

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  retracted-claims-tripwire:
    name: Retracted-claims tripwire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the retracted CauseBench harness or its figures reappear
        run: |
          # CauseBench was withdrawn and its numbers retracted (CHANGELOG,
          # v2.2.x). Two independent guards, because ONE pattern list already
          # failed in production: on 2026-08-19, commit 4417bd0 ("checkpoint
          # before checking out main") put benchmarks/causebench/ back on main
          # and this job stayed green for sixteen days. It had two blind spots.
          # First, it matched the phrasing of the old marketing copy, while the
          # harness README says "causal bridge recall@1" and "synthetic: 60%",
          # which matched none of the patterns. Second, it never scanned *.py,
          # and CauseBench is a Python harness. A guard that gives false
          # assurance is worse than no guard.
          set -u
          fail=0

          # Guard 1: the harness must not exist at all. A path check cannot be
          # defeated by rewording, which is exactly how Guard 2 was defeated.
          if [ -e benchmarks/causebench ]; then
            echo "::error::benchmarks/causebench/ is back in the tree. It is retracted, and CHANGELOG.md states it no longer exists."
            fail=1
          fi

          # Guard 2: the retracted figures, in every phrasing seen so far.
          PATTERNS='root-cause recall@1|causal bridge recall@1|Vestige 60%|vector search 0%|on CauseBench|baselines recall@1'
          ALLOW='^(CHANGELOG\.md|docs/launch/causal-brain-demo\.html|docs/launch/backward-trace-animation-storyboard\.md|\.github/workflows/ci\.yml)'
          HITS=$(grep -rInE "$PATTERNS" \
            --include='*.md' --include='*.html' --include='*.rs' \
            --include='*.ts' --include='*.svelte' --include='*.js' \
            --include='*.py' --include='*.sh' --include='*.json' \
            --exclude-dir=node_modules --exclude-dir=target \
            --exclude-dir=build . 2>/dev/null \
            | sed 's|^\./||' | grep -vE "$ALLOW" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Retracted CauseBench figures found — these numbers were withdrawn and must not be republished:"
            echo "$HITS"
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "clean: harness absent, and no retracted figures outside retraction notices"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin macOS to macos-14 (Sonoma): the rolling `macos-latest` image
        # The "ld: library 'clang_rt.osx' not found" failure is NOT a flaky
        # image. It is the linker resolving a clang compiler-rt search path
        # (Xcode .../clang/<N>/lib/darwin) that no longer exists on the runner,
        # because a STALE `target/` was restored from the cache after the
        # runner image's default Xcode moved. The real fix is the cache change
        # below (we no longer cache `target/`, and the key is bumped to v2 to
        # discard the poisoned caches), so the runner choice is no longer
        # load-bearing. macos-latest is fine again with a clean target dir.
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (registry only)
        uses: actions/cache@v4
        with:
          # Deliberately NOT caching `target/`: a `target/` built against a
          # different Xcode carries a stale clang compiler-rt search path that
          # breaks the linker ("clang_rt.osx not found"). Cache only the
          # download-heavy registry/git dirs; recompiling is cheap and correct.
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Check
        run: cargo check --workspace

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      # strata-migrate is workspace-excluded, so the step above never lints it.
      - name: Clippy strata-migrate (all features, warnings are errors)
        run: cargo clippy --manifest-path crates/strata-migrate/Cargo.toml -p strata-migrate --all-features -- -D warnings

      - name: Clippy strata-migrate without sqlite-reader (how strata-verify links it)
        run: cargo clippy --manifest-path crates/strata-migrate/Cargo.toml -p strata-migrate --no-default-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test SQLite harness (not linked into the default 4.0 binaries)
        # v3-engine implies legacy-sqlite and is the raw harness that can
        # create synthetic stores. It is not a default of the shipped bins.
        run: |
          cargo test -p vestige-core --features bundled-sqlite,v3-engine,connectors,cloud-sync --lib
          cargo test -p vestige-mcp --features v3-engine --lib --tests
          cargo test -p vestige-phase-1-tests --features legacy-sqlite
          cargo test -p vestige-differential-tests --features legacy-sqlite

      - name: Upgrade and withheld-erasure stdio tests (need the v3 importer)
        run: cargo test -p vestige-mcp --features legacy-sqlite,migrate-to-strata --test imported_graph_stdio --test retire_policy_stdio

      - name: strata-migrate acceptance tests (workspace-excluded crate; own CI job per audit)
        run: cargo test --manifest-path crates/strata-migrate/Cargo.toml

      - name: strata-verify (migrated-log verification)
        run: cargo test --manifest-path crates/strata-verify/Cargo.toml
      - name: Test strata-store
        run: cargo test --manifest-path crates/strata-store/Cargo.toml

      - name: Test strata-backtest (offline replay harness, workspace-excluded)
        run: cargo test --manifest-path crates/strata-backtest/Cargo.toml

      - name: Check committed Mattar-Daw results (release bytes)
        run: cargo run --quiet --release --manifest-path crates/strata-backtest/Cargo.toml --bin strata-backtest -- --prereg docs/benchmarks/MATTAR-EVB-PREREGISTRATION.md --check docs/benchmarks/results/mattar-evb-v1.json

      - name: Test the strata log, kernel and gate crates (workspace-excluded)
        run: |
          cargo test --manifest-path crates/strata/Cargo.toml
          cargo test --manifest-path crates/strata-kernel/Cargo.toml
          cargo test --manifest-path crates/strata-gate/Cargo.toml

      - name: Clippy every workspace-excluded strata crate (warnings are errors)
        run: |
          for crate in strata strata-kernel strata-gate strata-store strata-verify strata-backtest; do
            cargo clippy --manifest-path "crates/$crate/Cargo.toml" --all-targets -- -D warnings
          done

      - name: Test paid cloud-sync path
        # `cloud_sync` is cfg'd on cloud-sync AND legacy-sqlite. The sqlite
        # wipe dropped both sqlite features from the default set, and this
        # step builds vestige-core alone, so opt back into the backend the
        # paid path actually runs against.
        run: cargo test --locked --package vestige-core --features cloud-sync,bundled-sqlite cloud --lib

  no-embeddings-build:
    # The configuration Termux users build from source (#145): no ONNX Runtime,
    # no usearch, no libgit2. Every cfg gate that keeps it compiling is invisible
    # to the default build, so without this job it rots between releases. The
    # first time it was checked it carried eight dead-code warnings.
    name: No-embeddings build (Android / Termux profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo (registry only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-noembed-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-noembed-v1-

      - name: Clippy without embeddings, vector search or git2 (warnings are errors)
        run: cargo clippy -p vestige-mcp -p vestige-core --no-default-features --features vestige-mcp/connectors,vestige-mcp/cloud-sync,vestige-mcp/legacy-sqlite --all-targets -- -D warnings

      - name: Test vestige-core without embeddings
        # Reopen tests are the raw engine harness (v3-engine). Without it the
        # read-write guard refuses the synthetic stores they just created.
        # The later build step omits v3-engine — the shipped binary stays
        # creation-blocked.
        run: cargo test -p vestige-core --no-default-features --features bundled-sqlite,v3-engine --lib

      - name: Test vestige-mcp without embeddings
        # Tests are the raw engine harness (v3-engine): they create synthetic
        # stores. The later build step omits it — the shipped binary stays
        # creation-blocked.
        run: cargo test -p vestige-mcp --no-default-features --features connectors,cloud-sync,legacy-sqlite,vestige-mcp/v3-engine --lib

      - name: Build disposable context-contract test server
        run: cargo build -p vestige-mcp --no-default-features --features connectors,cloud-sync,legacy-sqlite --bin vestige-mcp

      - name: Verify evidence parity through MCP
        run: python3 scripts/test-context-evidence.py --binary target/debug/vestige-mcp

  # The Termux target built by CI instead of by hand (#145). cargo-ndk drives
  # the NDK clang that GitHub's ubuntu-24.04 image ships (ANDROID_NDK_HOME is
  # preset), API 24 is Termux's floor, and the no-embeddings profile is the one
  # that compiles without ONNX Runtime. The readelf gate is the point of the
  # job: a binary that quietly links libc++_shared or a host library would
  # start on the runner and die on the phone.
  android-build:
    name: Android build (aarch64-linux-android, no embeddings)
    runs-on: ubuntu-24.04
    needs: [no-embeddings-build]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    env:
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Add target to the pinned toolchain
        run: rustup target add aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-aarch64-linux-android-cargo-${{ hashFiles('**/Cargo.lock') }}

      # ~/.cargo/bin is in the cache, so a warm cache already holds cargo-ndk
      # and `cargo install` refuses to overwrite it (exit 101). Reuse it.
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      # openssl-src (git2's vendored OpenSSL) configures Android through the
      # NDK's clang wrappers, which it looks for on PATH under ANDROID_NDK_ROOT.
      # cargo-ndk sets the Rust-side CC, AR, and linker variables.
      - name: Point OpenSSL's build at the NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build (release, no embeddings)
        env:
          CXXSTDLIB: c++_static
        run: |
          # cargo-ndk 4 takes the API level as --platform; a bare -p is handed
          # to cargo as --package, and "unknown package: 24" is what you get.
          cargo ndk -t arm64-v8a --platform "$ANDROID_API" build --release -p vestige-mcp \
            --no-default-features

      - name: Only bionic may be a runtime dependency
        run: |
          BIN=target/aarch64-linux-android/release/vestige-mcp
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -h "$BIN" | grep -E 'Machine:\s+AArch64'
          "$READELF" -d "$BIN" | grep NEEDED | tee needed.txt
          if grep -vE '\[(libc|libm|libdl|liblog)\.so\]' needed.txt; then
            echo "::error::vestige-mcp links a library Termux does not guarantee (listed above)"
            exit 1
          fi

      - name: Package
        run: |
          cd target/aarch64-linux-android/release
          tar czf ../../../vestige-mcp-aarch64-linux-android.tar.gz vestige-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-aarch64-linux-android
          path: vestige-mcp-aarch64-linux-android.tar.gz

  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Run on main pushes AND on PRs that touch workflows, Cargo manifests, or
    # crate sources — so Intel Mac / Linux release targets are validated
    # before merge, not after.
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            cargo_flags: ""
          # 4.0 has no ONNX runtime: Intel Mac builds the default features,
          # the same set release.yml ships.
          - os: macos-14
            target: x86_64-apple-darwin
            cargo_flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the toolchain, so cargo runs the pinned version
      # rather than the stable one the action installed. Add the cross-compile
      # target to the pinned toolchain too, or the build fails with
      # "can't find crate for `core`".
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }} -p vestige-mcp ${{ matrix.cargo_flags }}
          cargo build --release --target ${{ matrix.target }} -p vestige-upgrade

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore vestige-upgrade

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-${{ matrix.target }}
          path: vestige-mcp-${{ matrix.target }}.tar.gz

  # Windows is otherwise compiled only by release.yml when a tag is cut, so an
  # MSVC-only break (usearch 2.24.0 referencing POSIX MAP_FAILED, #93 before it)
  # surfaces after the release exists. This job mirrors release.yml's Windows
  # job: the dashboard check, test and build first (the v2.8.0 release build
  # died on a dashboard test that had never run on Windows), then the default
  # feature set compiled on MSVC, so both prove themselves on every pull request.
  windows-msvc-build:
    name: Windows MSVC build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    needs: [test]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dashboard check, test and build on Windows
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vestige/dashboard check
          pnpm --filter @vestige/dashboard test
          pnpm --filter @vestige/dashboard build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: |
          cargo build --release -p vestige-mcp
          cargo build --release -p vestige-upgrade

      - name: Smoke the binary
        run: ./target/release/vestige-mcp.exe --version

      - name: Test the Strata log, store and upgrade on Windows
        # The log's positioned reads, directory syncs and signing seed take
        # Windows-only code paths that a build alone does not exercise; so do
        # the serve lock and the loopback attach endpoint every second agent
        # uses. bash, so the first failing command fails the step (pwsh
        # reports only the last one).
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/strata/Cargo.toml
          cargo test --manifest-path crates/strata-store/Cargo.toml
          cargo test -p vestige-upgrade
          cargo test -p vestige-mcp --lib attach::
          cargo test -p vestige-mcp --test attach_stdio

  # Linux-gnu is built in Ubuntu 22.04 (glibc 2.35), not ubuntu-latest.
  # ubuntu-latest is 24.04+/glibc 2.39, which is why the published 2.3.0
  # asset dies on 22.04 and Debian 12 with GLIBC_2.38 not found (#174, #175).
  # musl is not used: ONNX Runtime (embeddings) ships no musl prebuilts.
  # The ubuntu-22.04 *runner* begins deprecation in 2026; a container keeps
  # the glibc floor after that label is retired.
  release-build-linux:
    name: Release Build (x86_64-unknown-linux-gnu, glibc 2.35)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    needs: [test]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          bash -lc "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config cmake python3 perl xz-utils unzip binutils libssl-dev software-properties-common gnupg"
          bash -lc "add-apt-repository -y ppa:ubuntu-toolchain-r/test && apt-get update"
          bash -lc "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-13"

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Add target to the pinned toolchain
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-gnu-glibc235-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        env:
          CXX: g++-13
          # ort-sys emits its libstdc++ link from ORT_CXX_STDLIB/CXXSTDLIB;
          # 'static=stdc++' makes it a static-kind link resolved from GCC-13's
          # archive (-L native), so the binary records no libstdc++.so.6 NEEDED
          # and the dynamic GLIBCXX set is empty (floor: Debian 12 / Ubuntu 22.04).
          # Verified in the docker build lab: objdump GLIBCXX refs = none,
          # ceiling check passes, smoke passes on aarch64.
          ORT_CXX_STDLIB: static=stdc++
          CXXSTDLIB: static=stdc++
          RUSTFLAGS: -C link-arg=-static-libstdc++ -L native=/usr/lib/gcc/x86_64-linux-gnu/13
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p vestige-mcp
          cargo build --release --target x86_64-unknown-linux-gnu -p vestige-upgrade

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar czf ../../../vestige-mcp-x86_64-unknown-linux-gnu.tar.gz vestige-mcp vestige vestige-restore vestige-upgrade

      - name: Check glibc ceiling
        run: ./scripts/check-linux-glibc.sh target/x86_64-unknown-linux-gnu/release/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: ./scripts/smoke-vestige-mcp.sh target/x86_64-unknown-linux-gnu/release/vestige-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-x86_64-unknown-linux-gnu
          path: vestige-mcp-x86_64-unknown-linux-gnu.tar.gz

  linux-compat-smoke:
    name: Linux compat smoke (Ubuntu 22.04 / Debian 12)
    runs-on: ubuntu-latest
    needs: [release-build-linux]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-gnu artifact
        uses: actions/download-artifact@v4
        with:
          name: vestige-mcp-x86_64-unknown-linux-gnu
          path: dist

      - name: Extract
        run: tar -xzf dist/vestige-mcp-x86_64-unknown-linux-gnu.tar.gz -C dist

      - name: Check glibc ceiling
        run: ./scripts/check-linux-glibc.sh dist/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            ubuntu:22.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

      - name: Exec vestige-mcp on Debian 12 bookworm
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            debian:bookworm \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

  # aarch64 Linux (Raspberry Pi 5, Graviton, Ampere) on GitHub's arm64 runner,
  # inside the same Ubuntu 22.04 container so the glibc 2.35 floor holds. ort-sys
  # ships an ONNX Runtime prebuilt for aarch64-unknown-linux-gnu, so the default
  # feature set builds unchanged. Same glibc check and the same smoke on Ubuntu
  # 22.04 and Debian 12 arm64 images as the x86_64 job.
  release-build-linux-arm64:
    name: Release Build (aarch64-unknown-linux-gnu, glibc 2.35)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    needs: [test]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          bash -lc "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config cmake python3 perl xz-utils unzip binutils libssl-dev software-properties-common gnupg"
          bash -lc "add-apt-repository -y ppa:ubuntu-toolchain-r/test && apt-get update"
          bash -lc "DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++-13"

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Add target to the pinned toolchain
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-gnu-arm64-glibc235-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        env:
          CXX: g++-13
          # ort-sys emits its libstdc++ link from ORT_CXX_STDLIB/CXXSTDLIB;
          # 'static=stdc++' makes it a static-kind link resolved from GCC-13's
          # archive (-L native), so the binary records no libstdc++.so.6 NEEDED
          # and the dynamic GLIBCXX set is empty (floor: Debian 12 / Ubuntu 22.04).
          # Verified in the docker build lab: objdump GLIBCXX refs = none,
          # ceiling check passes, smoke passes on aarch64.
          ORT_CXX_STDLIB: static=stdc++
          CXXSTDLIB: static=stdc++
          RUSTFLAGS: -C link-arg=-static-libstdc++ -L native=/usr/lib/gcc/aarch64-linux-gnu/13
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu -p vestige-mcp
          cargo build --release --target aarch64-unknown-linux-gnu -p vestige-upgrade

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar czf ../../../vestige-mcp-aarch64-unknown-linux-gnu.tar.gz vestige-mcp vestige vestige-restore vestige-upgrade

      - name: Check glibc ceiling
        run: ./scripts/check-linux-glibc.sh target/aarch64-unknown-linux-gnu/release/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: ./scripts/smoke-vestige-mcp.sh target/aarch64-unknown-linux-gnu/release/vestige-mcp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-aarch64-unknown-linux-gnu
          path: vestige-mcp-aarch64-unknown-linux-gnu.tar.gz

  linux-compat-smoke-arm64:
    name: Linux arm64 compat smoke (Ubuntu 22.04 / Debian 12)
    runs-on: ubuntu-24.04-arm
    needs: [release-build-linux-arm64]
    if: |
      github.ref == 'refs/heads/main' ||
      github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download linux-gnu artifact
        uses: actions/download-artifact@v4
        with:
          name: vestige-mcp-aarch64-unknown-linux-gnu
          path: dist

      - name: Extract
        run: tar -xzf dist/vestige-mcp-aarch64-unknown-linux-gnu.tar.gz -C dist

      - name: Check glibc ceiling
        run: ./scripts/check-linux-glibc.sh dist/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            ubuntu:22.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

      - name: Exec vestige-mcp on Debian 12 bookworm
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            debian:bookworm \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'
