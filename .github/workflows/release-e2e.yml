# v4.0.0 tag gate.
#
# Runs on push to `v4` and on manual dispatch. Lane PRs into v4 do not run
# this job, so they stay green unless something else breaks. A red row on the
# v4 head blocks the tag. Do not silence it with continue-on-error, skip, or
# #[ignore]. The crate is outside the root workspace so `cargo test --workspace`
# stays the merge CI.

name: release-e2e

on:
  workflow_dispatch:
  push:
    branches: [v4]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  release-e2e:
    name: release-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo (registry only)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-release-e2e-v1-${{ hashFiles('**/Cargo.lock', 'tests/release-e2e/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-e2e-v1-

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config libssl-dev binutils

      - name: Build product binaries
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/target"
          cargo build -p vestige-mcp --bins
          cargo build --manifest-path crates/strata-verify/Cargo.toml --bin strata-verify

      - name: Release matrix
        env:
          VESTIGE_BIN: ${{ github.workspace }}/target/debug/vestige
          VESTIGE_MCP_BIN: ${{ github.workspace }}/target/debug/vestige-mcp
          STRATA_VERIFY_BIN: ${{ github.workspace }}/target/debug/strata-verify
        run: |
          set -euo pipefail
          # Own target dir. Sharing one with the root workspace poisons
          # fingerprints across the two Cargo.lock files. The product bins
          # are passed in explicitly.
          unset CARGO_TARGET_DIR
          cargo test --manifest-path tests/release-e2e/Cargo.toml -- --test-threads=1
