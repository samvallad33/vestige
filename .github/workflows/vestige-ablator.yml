name: Vestige Ablator

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ablate:
    name: Vestige Halpern-Pearl Hunk Ablator
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/vestige ablate ') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head branch & SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('head_sha', pr.head.sha);
            const raw = context.payload.comment.body.trim();
            const firstLine = raw.split(/\r?\n/)[0];
            const cmd = firstLine.replace(/^\/vestige\s+ablate\s+/, '').trim();
            core.setOutput('oracle_cmd', cmd);

      - name: Checkout PR HEAD with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vestige-causal-gate

      - name: Build local Vestige CLI
        run: cargo build --release -p vestige-mcp --bin vestige

      - name: Run Halpern-Pearl Counterfactual Hunk Ablation
        id: run_ablate
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ORACLE_CMD: ${{ steps.pr.outputs.oracle_cmd }}
        run: |
          set +e
          ./target/release/vestige ablate \
            --repo "$GITHUB_WORKSPACE" \
            --commit "$HEAD_SHA" \
            --oracle "$ORACLE_CMD" \
            --max-hunks 16 > ablate.json
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cat ablate.json
          exit 0

      - name: Post Halpern-Pearl Ablation Proof Card on PR
        uses: actions/github-script@v7
        env:
          ORACLE_CMD: ${{ steps.pr.outputs.oracle_cmd }}
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('ablate.json', 'utf8'));
            const nec = data.necessary_hunks || [];
            const sup = data.superstitious_hunks || [];
            const coup = data.coupled_hunks || [];
            let badge = '🟢 **MINIMAL CORE VERIFIED**';
            if (data.status === 'rejected_tautology') {
              badge = '🔴 **REJECTED — TAUTOLOGICAL SELF-CONFIRMING TEST**';
            } else if (data.status !== 'completed') {
              badge = `🟠 **${(data.code || data.status || 'FAILED').toUpperCase()}**`;
            } else if (sup.length > 0) {
              badge = `🟡 **${sup.length} SUPERSTITIOUS NOISE HUNK(S) DETECTED**`;
            }
            const lines = [
              '<!-- vestige-ablator -->',
              '## 🔬 Vestige Ablator — Halpern–Pearl Counterfactual Hunk Proof',
              '',
              `**Status:** ${badge}`,
              `**Oracle:** \`${process.env.ORACLE_CMD}\``,
              '',
              '| Metric | Value |',
              '| :--- | :--- |',
              `| **Commit** | \`${(data.commit || '').slice(0, 10)}\` (parent \`${(data.parent || '').slice(0, 10)}\`) |`,
              `| **Red-Before / Green-After Tautology Check** | \`${data.tautology_check || 'unknown'}\` |`,
              `| **Halpern–Pearl Necessary Hunks** | **${nec.length}** |`,
              `| **Superstitious Noise Hunks** | **${sup.length}** |`,
              `| **Coupled Hunks** | **${coup.length}** |`,
              `| **Joint Minimality Verified** | \`${data.joint_minimality_verified}\` |`,
              `| **BLAKE3 Proof Digest** | \`${(data.proof_digest_blake3 || '').slice(0, 24)}\` |`,
              '',
            ];
            if (nec.length > 0 || sup.length > 0) {
              lines.push('| Hunk | File | Header | Counterfactual Verdict |', '| :--- | :--- | :--- | :--- |');
              for (const h of [...nec, ...sup, ...coup]) {
                lines.push(`| #${h.index} | \`${h.file}\` | \`${h.header}\` | \`${h.verdict}\` |`);
              }
              lines.push('');
            }
            if (data.detail) {
              lines.push(`> ${data.detail}`, '');
            }
            lines.push('---', '*Computed in an isolated detached git worktree by **Vestige Ablator** — zero LLMs, zero cloud, $0.00.*');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
