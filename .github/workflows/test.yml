name: Test Suite

on:
  push:
    branches: [main, v4, release/**]
  pull_request:
    branches: [main, v4, release/**]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VESTIGE_TEST_MOCK_EMBEDDINGS: "1"

jobs:
  hook-tests:
    name: Hook Tests
    # setup-python has no 3.9 build for the ubuntu-latest image (26.04); pin to 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m unittest discover -s tests/hooks -p 'test_*.py'
      - run: python3 -m py_compile hooks/sanhedrin-local.py tests/hooks/test_sanhedrin_claim_mode.py
      - run: bash -n hooks/sanhedrin.sh scripts/install-sandwich.sh scripts/check-sandwich-prereqs.sh

  operator-lite:
    name: Native Rust Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run native Rust gate & hook unit suites
        run: |
          cargo test -p vestige-hook
          cargo test -p vestige-mcp --lib native_
      - name: Build vestige CLI and run offline gate self-test + status
        shell: bash
        run: |
          cargo build -p vestige-hook --bin vestige-hook
          cargo build -p vestige-mcp --bin vestige
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "./target/debug/vestige-hook${ext}" --version
          "./target/debug/vestige${ext}" gate test
          "./target/debug/vestige${ext}" gate status

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib

  mcp-tests:
    name: MCP E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p vestige-mcp \
            --test boot_no_network \
            --test stdio_shutdown \
            --test secret_gate_stdio \
            --test selftest_stdio \
            --test smart_ingest_proof_stdio \
            --test strata_stdio_receipt_project \
            --test unavailable_stdio \
            --test attach_stdio \
            --test v3_dispatch

  journey-tests:
    name: User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p vestige-mcp \
            --test full_flow_stdio \
            --test causal_walk_stdio \
            --test forgotten_lesson_stdio \
            --test ghostlink_stdio \
            --test intention_stdio \
            --test dedup_policy_stdio \
            --test dream_compile_stdio \
            --test reviewed_at_stdio \
            --test cli_strata \
            --test cli_sandwich_install \
            --test rules_hook_cli
          cargo test -p vestige-upgrade

  antigravity-hooks-e2e:
    name: Antigravity 6-Tool E2E Hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build v7 vestige-hook, vestige & vestige-mcp binaries
        run: |
          cargo build -p vestige-hook --bin vestige-hook
          cargo build -p vestige-mcp --bins
      - name: Run undeniable Antigravity & Multi-Runtime E2E hook suites against live Rust binaries
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          export VESTIGE_HOOK_BIN="$PWD/target/debug/vestige-hook${ext}"
          export VESTIGE_MCP_BIN="$PWD/target/debug/vestige-mcp${ext}"
          export VESTIGE_BIN="$PWD/target/debug/vestige${ext}"
          node --test packages/vestige-init/test/antigravity-hooks-liveness.test.js packages/vestige-init/test/multi-runtime-hooks.test.js

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm --filter @vestige/dashboard build
      - name: "@vestige/init: the PRECEDENT terminal journey"
        run: node --test packages/vestige-init/test/*.test.js

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          cargo build -p vestige-mcp --bin vestige-mcp --bin vestige
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
