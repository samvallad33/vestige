name: Test Suite

on:
  push:
    branches: [main, v4, release/**]
  pull_request:
    branches: [main, v4, release/**]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VESTIGE_TEST_MOCK_EMBEDDINGS: "1"

jobs:
  hook-tests:
    name: Hook Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python3 -m unittest discover -s tests/hooks -p 'test_*.py'
      - run: python3 -m py_compile hooks/sanhedrin-local.py tests/hooks/test_sanhedrin_claim_mode.py
      - run: bash -n hooks/sanhedrin.sh scripts/install-sandwich.sh scripts/check-sandwich-prereqs.sh

  operator-lite:
    name: Operator Lite (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python operator-lite/test_windows.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_parser.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_replay.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_install_guard.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_sqlpipe.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_strata_guard.py
      - if: runner.os != 'Windows'
        run: python3 operator-lite/test_self_protect.py
      - if: runner.os != 'Windows'
        name: receipts chain to the ledger's last line, not to HEAD
        run: python3 operator-lite/test_receipts.py
      - if: runner.os != 'Windows'
        name: a fresh install stops every clearly destructive command
        run: python3 operator-lite/test_destructive.py
      - if: runner.os != 'Windows'
        name: OP-012 through OP-025, the evidence lock and planted canaries, each its own suite
        run: |
          for t in floor root gitspawn written arming sequence session_hold memory_rules protected remote_delete brake turnover evidence_lock canary; do
            echo "== test_$t"
            python3 "operator-lite/test_$t.py" || exit 1
          done
      - name: an upgrade from 0.3.7 blocks
        run: python operator-lite/test_upgrade.py
      - if: runner.os != 'Windows'
        name: the upgrade offer reaches the owner at a terminal, never an agent or a pipe
        run: python3 operator-lite/test_upgrade_moments.py
      - if: runner.os != 'Windows'
        name: the npm package carries this gate at its own version
        run: node operator-lite/npm/test.js
      - if: runner.os != 'Windows'
        name: the pip package's gate contract, against this gate
        run: OPERATOR_GATE="$PWD/operator-lite/operator-gate.py" python3 operator-lite/pypi/operator-lite/test_smoke.py
      - if: runner.os != 'Windows'
        name: every host port's own test suite, offline
        run: |
          for t in operator-lite/ports/*/test.sh; do
            echo "== $t"
            # a home outside every temp folder: the gate treats temp paths as scratch, and the port tests
            # check deletes that must be stopped
            h="$HOME/operator-lite-ports/$(basename "$(dirname "$t")")"
            mkdir -p "$h"
            HOME="$h" bash "$t" || exit 1
          done
      - if: runner.os != 'Windows'
        run: python3 operator-lite/operator-gate.py corpus guardfall
      - if: runner.os != 'Windows'
        name: the full Operator gate loads 102 rules and each one fires
        run: python3 operator/test_rules.py
      - if: runner.os != 'Windows'
        run: cmp operator-lite/operator-gate.py operator-lite/openclaw-plugin/gate/operator-gate.py
      - if: runner.os != 'Windows'
        run: cmp operator-lite/operator-gate.py operator-lite/ports/opencode/operator-gate.py
      - if: runner.os != 'Windows'
        run: cmp operator/operator-gate.py packages/vestige-init/hooks/operator-gate.py
      - if: runner.os != 'Windows'
        run: cmp operator-lite/operator-gate.py operator/lite_core.py
      - if: runner.os != 'Windows'
        run: cmp operator-lite/operator-gate.py packages/vestige-init/hooks/lite_core.py

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --lib

  mcp-tests:
    name: MCP E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p vestige-mcp \
            --test boot_no_network \
            --test stdio_shutdown \
            --test secret_gate_stdio \
            --test selftest_stdio \
            --test smart_ingest_proof_stdio \
            --test strata_stdio_receipt_project \
            --test unavailable_stdio \
            --test attach_stdio \
            --test v3_dispatch

  journey-tests:
    name: User Journey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test -p vestige-mcp \
            --test full_flow_stdio \
            --test causal_walk_stdio \
            --test forgotten_lesson_stdio \
            --test ghostlink_stdio \
            --test intention_stdio \
            --test dedup_policy_stdio \
            --test dream_compile_stdio \
            --test reviewed_at_stdio \
            --test cli_strata \
            --test cli_sandwich_install \
            --test rules_hook_cli
          cargo test -p vestige-upgrade

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm --filter @vestige/dashboard build
      - name: "@vestige/init: the PRECEDENT terminal journey"
        run: node --test packages/vestige-init/test/*.test.js

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
