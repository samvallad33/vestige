name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v2.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries statically link a prebuilt libonnxruntime.a whose
          # objects import the C23 __isoc23_* symbols at GLIBC_2.38, which made
          # v2.3.0 abort at startup on every distro older than Ubuntu 24.04
          # (issues #174, #175). crates/vestige-mcp/src/glibc_compat.rs defines
          # those symbols locally, along with the pidfd_* pair that pinned the
          # `vestige` CLI to GLIBC_2.39, so the floor lands at GLIBC_2.34.
          # max_glibc is set per target rather than globally so one architecture
          # regressing can never be masked by the other.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cargo_flags: ""
            needs_onnxruntime: false
            max_glibc: "2.34"
            cc_target: x86_64_unknown_linux_gnu
          # packages/vestige-mcp-npm/package.json advertises linux/arm64, and
          # until now no such asset existed, so `npm install -g` died in
          # postinstall on every arm64 Linux box: Graviton, Ampere, arm64 CI
          # containers, Asahi.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            cargo_flags: ""
            needs_onnxruntime: false
            max_glibc: "2.34"
            cc_target: aarch64_unknown_linux_gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            # vector-search (usearch HNSW index) is REQUIRED. Without it the
            # storage layer's #[cfg(feature = "vector-search")] paths compile
            # out, so embeddings are never persisted or queried: the binary
            # reports "Embedding Service: Not Ready", 0% coverage, consolidate
            # generates 0 embeddings, and no model download is ever attempted.
            # usearch builds cleanly on MSVC because vestige-core pins it with
            # features=["fp16lib"] (see crates/vestige-core/Cargo.toml).
            cargo_flags: "--no-default-features --features embeddings,ort-download,vector-search,cloud-sync,connectors"
            needs_onnxruntime: false
          # Intel Mac uses the ort-dynamic feature to runtime-link against a
          # system libonnxruntime (Homebrew), sidestepping the missing
          # x86_64-apple-darwin prebuilts in ort-sys 2.0.0-rc.11. Binary
          # consumers must `brew install onnxruntime` before running — see
          # INSTALL-INTEL-MAC.md bundled in the tarball.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: "--no-default-features --features ort-dynamic,vector-search,cloud-sync,connectors"
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the toolchain, so cargo runs the pinned version
      # rather than the stable one the action installed. Add the cross-compile
      # target to the pinned toolchain too, or the build fails with
      # "can't find crate for `core`".
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          if (!expected) {
            throw new Error('Release tag is empty');
          }

          const packageFiles = [
            'package.json',
            'apps/dashboard/package.json',
            'packages/vestige-init/package.json',
            'packages/vestige-mcp-npm/package.json'
          ];
          for (const file of packageFiles) {
            const actual = require(`./${file}`).version;
            if (actual !== expected) {
              throw new Error(`${file} version ${actual} does not match ${tag}`);
            }
          }

          const metadata = JSON.parse(execFileSync('cargo', [
            'metadata',
            '--format-version',
            '1',
            '--locked',
            '--no-deps'
          ], { encoding: 'utf8' }));
          for (const name of ['vestige-core', 'vestige-mcp']) {
            const pkg = metadata.packages.find((candidate) => candidate.name === name);
            if (!pkg) throw new Error(`Missing Cargo package ${name}`);
            if (pkg.version !== expected) {
              throw new Error(`${name} version ${pkg.version} does not match ${tag}`);
            }
          }
          NODE

      - name: Build embedded dashboard
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vestige/dashboard check
          pnpm --filter @vestige/dashboard test
          pnpm --filter @vestige/dashboard build
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          const versionFile = 'apps/dashboard/build/_app/version.json';
          const version = JSON.parse(fs.readFileSync(versionFile, 'utf8')).version;
          if (version !== expected) {
            throw new Error(`${versionFile} version ${version} does not match ${tag}`);
          }
          for (const file of ['apps/dashboard/build/index.html', versionFile]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Dashboard build did not produce ${file}`);
            }
          }
          NODE

      # Linux binaries are compiled inside AlmaLinux 9, not on the runner.
      #
      # The runner is Ubuntu 24.04, whose GCC 13 binds C++ symbols at
      # GLIBCXX_3.4.30 / CXXABI_1.3.15. RHEL, Rocky and AlmaLinux 9 ship
      # libstdc++ 6.0.29, which stops at GLIBCXX_3.4.29 / CXXABI_1.3.13, so a
      # runner-built binary cannot start there at all. That gap predates the
      # #174 / #175 crash and went unnoticed because nothing checked it.
      #
      # gcc-toolset-14 is the standard answer, and the same trick manylinux uses:
      # a modern compiler — needed for symbols like __truncdfhf2 that EL9's stock
      # GCC 11 libgcc lacks and the prebuilt ONNX Runtime archive calls — linked
      # against EL9's older libstdc++ ABI. EL9's glibc is 2.34, the floor these
      # binaries already reach.
      #
      # Verified on a real aarch64 build: GLIBC 2.34, GLIBCXX 3.4.29,
      # CXXABI 1.3.11, and all three binaries start on rockylinux:9, debian:12
      # and ubuntu:22.04.
      #
      # CXXFLAGS_<target>=-U__FAST_MATH__ is a separate fix riding along. usearch
      # 2.23.0's build.rs compiles its C++ with `-O3 -ffast-math`, which defines
      # __FAST_MATH__; glibc's math-vector.h declares its vector-math simd clones
      # behind that macro, so GCC vectorized the std::log loop in usearch's
      # Jensen-Shannon metric into _ZGV* symbols that live only in libmvec.so.1 —
      # a library aarch64 did not get until glibc 2.38. Vestige never selects the
      # divergence metric, so dead template code was adding a shared-library
      # dependency for nothing.
      #
      # cc-rs appends env CXXFLAGS last, so this lands after -ffast-math and
      # closes the gate. It changes no math semantics, only whether glibc
      # declares the clones, so the distance kernels are untouched: measured on
      # the real usearch header, k_cos disassembly is 104 lines at baseline, 104
      # with -U__FAST_MATH__, and 126 with -fmath-errno, which also removes the
      # symbols but adds an errno branch around sqrt. MetricKind::Cos is the only
      # metric Vestige uses, so that cost would land on the hot path.
      # -fno-tree-vectorize works too and is far worse: 5.6x slower there.
      #
      # The dashboard is built on the runner in the step above and embedded from
      # the working tree, so the container only has to compile Rust.
      - name: Build (Linux, inside AlmaLinux 9 for an old libstdc++ ABI)
        if: contains(matrix.target, 'linux-gnu')
        env:
          CC_TARGET: ${{ matrix.cc_target }}
        run: |
          # Pre-create it so Docker does not, which would leave a root-owned
          # directory behind for the cache step to trip over.
          mkdir -p "$HOME/.cargo/registry"
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -e "CXXFLAGS_${CC_TARGET}=-U__FAST_MATH__" \
            -e CARGO_TERM_COLOR=always \
            almalinux:9 bash -eo pipefail -c '
              dnf -y install --allowerasing gcc gcc-c++ gcc-toolset-14 make cmake \
                perl-core pkgconfig openssl-devel binutils curl git >/dev/null
              source /opt/rh/gcc-toolset-14/enable
              # Read the channel key specifically. A bare version-number grep
              # picks up the 1.97.0 mentioned in the comment above it and
              # silently installs the wrong toolchain.
              TOOLCHAIN=$(sed -n "s/^ *channel *= *\"\([^\"]*\)\".*/\1/p" rust-toolchain.toml | head -1)
              test -n "$TOOLCHAIN"
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
                --default-toolchain "$TOOLCHAIN" >/dev/null
              . "$HOME/.cargo/env"
              rustup target add ${{ matrix.target }}
              cargo build --locked --package vestige-mcp --release \
                --target ${{ matrix.target }} ${{ matrix.cargo_flags }}
              # The container runs as root; hand artifacts back to whoever owns
              # the mounted checkout so later steps need no sudo.
              OWNER=$(stat -c "%u:%g" /repo)
              chown -R "$OWNER" target /root/.cargo/registry
            '

      - name: Build (non-Linux)
        if: ${{ !contains(matrix.target, 'linux-gnu') }}
        run: cargo build --locked --package vestige-mcp --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      # A binary that imports GLIBC_2.38 runs fine on the runner that built it
      # and aborts on every older distro, so nothing short of an explicit check
      # catches it before users do. This is the issue #174 / #175 tripwire.
      - name: Verify glibc floor (Linux)
        if: contains(matrix.target, 'linux-gnu')
        env:
          VESTIGE_MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          scripts/check-glibc-floor.sh \
            target/${{ matrix.target }}/release/vestige-mcp \
            target/${{ matrix.target }}/release/vestige \
            target/${{ matrix.target }}/release/vestige-restore

      # The static check above bounds symbol versions it knows to look for, and
      # that proxy has already been wrong twice: it once passed a binary that
      # could not start on RHEL 9, and it cannot see a DT_NEEDED library that is
      # simply absent on the target. Running the binary is the only check that
      # cannot be fooled by a symbol class nobody enumerated.
      - name: Verify it starts on the oldest supported distros (Linux)
        if: contains(matrix.target, 'linux-gnu')
        run: |
          scripts/check-runs-on-baseline.sh \
            target/${{ matrix.target }}/release/vestige-mcp \
            target/${{ matrix.target }}/release/vestige \
            target/${{ matrix.target }}/release/vestige-restore

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp docs/INSTALL-INTEL-MAC.md target/${{ matrix.target }}/release/ 2>/dev/null || true
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            tar -czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore INSTALL-INTEL-MAC.md
          else
            tar -czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path vestige-mcp.exe,vestige.exe,vestige-restore.exe -DestinationPath ../../../vestige-mcp-${{ matrix.target }}.zip

      - name: Generate checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 vestige-mcp-${{ matrix.target }}.${{ matrix.archive }} > vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
          else
            sha256sum vestige-mcp-${{ matrix.target }}.${{ matrix.archive }} > vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}
            vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
