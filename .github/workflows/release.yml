name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v2.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            # vector-search (usearch HNSW index) is REQUIRED. Without it the
            # storage layer's #[cfg(feature = "vector-search")] paths compile
            # out, so embeddings are never persisted or queried: the binary
            # reports "Embedding Service: Not Ready", 0% coverage, consolidate
            # generates 0 embeddings, and no model download is ever attempted.
            # usearch builds cleanly on MSVC because vestige-core pins it with
            # features=["fp16lib"] (see crates/vestige-core/Cargo.toml).
            cargo_flags: "--no-default-features --features embeddings,ort-download,vector-search,cloud-sync,connectors"
            needs_onnxruntime: false
          # Intel Mac uses the ort-dynamic feature to runtime-link against a
          # system libonnxruntime (Homebrew), sidestepping the missing
          # x86_64-apple-darwin prebuilts in ort-sys 2.0.0-rc.11. Binary
          # consumers must `brew install onnxruntime` before running — see
          # INSTALL-INTEL-MAC.md bundled in the tarball.
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: "--no-default-features --features ort-dynamic,vector-search,cloud-sync,connectors"
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cargo_flags: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the toolchain, so cargo runs the pinned version
      # rather than the stable one the action installed. Add the cross-compile
      # target to the pinned toolchain too, or the build fails with
      # "can't find crate for `core`".
      - name: Add target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          if (!expected) {
            throw new Error('Release tag is empty');
          }

          const packageFiles = [
            'package.json',
            'apps/dashboard/package.json',
            'packages/vestige-init/package.json',
            'packages/vestige-mcp-npm/package.json'
          ];
          for (const file of packageFiles) {
            const actual = require(`./${file}`).version;
            if (actual !== expected) {
              throw new Error(`${file} version ${actual} does not match ${tag}`);
            }
          }

          const metadata = JSON.parse(execFileSync('cargo', [
            'metadata',
            '--format-version',
            '1',
            '--locked',
            '--no-deps'
          ], { encoding: 'utf8' }));
          for (const name of ['vestige-core', 'vestige-mcp']) {
            const pkg = metadata.packages.find((candidate) => candidate.name === name);
            if (!pkg) throw new Error(`Missing Cargo package ${name}`);
            if (pkg.version !== expected) {
              throw new Error(`${name} version ${pkg.version} does not match ${tag}`);
            }
          }
          NODE

      - name: Build embedded dashboard
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vestige/dashboard check
          pnpm --filter @vestige/dashboard test
          pnpm --filter @vestige/dashboard build
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          const versionFile = 'apps/dashboard/build/_app/version.json';
          const version = JSON.parse(fs.readFileSync(versionFile, 'utf8')).version;
          if (version !== expected) {
            throw new Error(`${versionFile} version ${version} does not match ${tag}`);
          }
          for (const file of ['apps/dashboard/build/index.html', versionFile]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Dashboard build did not produce ${file}`);
            }
          }
          NODE

      - name: Build
        run: cargo build --locked --package vestige-mcp --release --target ${{ matrix.target }} ${{ matrix.cargo_flags }}

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp docs/INSTALL-INTEL-MAC.md target/${{ matrix.target }}/release/ 2>/dev/null || true
          cd target/${{ matrix.target }}/release
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            tar -czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore INSTALL-INTEL-MAC.md
          else
            tar -czf ../../../vestige-mcp-${{ matrix.target }}.tar.gz vestige-mcp vestige vestige-restore
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path vestige-mcp.exe,vestige.exe,vestige-restore.exe -DestinationPath ../../../vestige-mcp-${{ matrix.target }}.zip

      - name: Generate checksum
        shell: bash
        run: |
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 vestige-mcp-${{ matrix.target }}.${{ matrix.archive }} > vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
          else
            sha256sum vestige-mcp-${{ matrix.target }}.${{ matrix.archive }} > vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}
            vestige-mcp-${{ matrix.target }}.${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux-gnu is built in Ubuntu 22.04 (glibc 2.35), not ubuntu-latest.
  # The 2.3.0 asset was produced on ubuntu-latest and dies on 22.04 / Debian 12
  # with GLIBC_2.38 not found (#174, #175). musl is not used: ONNX Runtime
  # ships no musl prebuilts, so embeddings would not work. The ubuntu-22.04
  # runner label begins deprecation in 2026; a container keeps this floor.
  build-linux:
    name: Build x86_64-unknown-linux-gnu (glibc 2.35)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: bash -lc "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config cmake python3 perl xz-utils unzip binutils libssl-dev"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Add target to the pinned toolchain
        run: rustup target add x86_64-unknown-linux-gnu

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          if (!expected) {
            throw new Error('Release tag is empty');
          }

          const packageFiles = [
            'package.json',
            'apps/dashboard/package.json',
            'packages/vestige-init/package.json',
            'packages/vestige-mcp-npm/package.json'
          ];
          for (const file of packageFiles) {
            const actual = require(`./${file}`).version;
            if (actual !== expected) {
              throw new Error(`${file} version ${actual} does not match ${tag}`);
            }
          }

          const metadata = JSON.parse(execFileSync('cargo', [
            'metadata',
            '--format-version',
            '1',
            '--locked',
            '--no-deps'
          ], { encoding: 'utf8' }));
          for (const name of ['vestige-core', 'vestige-mcp']) {
            const pkg = metadata.packages.find((candidate) => candidate.name === name);
            if (!pkg) throw new Error(`Missing Cargo package ${name}`);
            if (pkg.version !== expected) {
              throw new Error(`${name} version ${pkg.version} does not match ${tag}`);
            }
          }
          NODE

      - name: Build embedded dashboard
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vestige/dashboard check
          pnpm --filter @vestige/dashboard test
          pnpm --filter @vestige/dashboard build
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          const versionFile = 'apps/dashboard/build/_app/version.json';
          const version = JSON.parse(fs.readFileSync(versionFile, 'utf8')).version;
          if (version !== expected) {
            throw new Error(`${versionFile} version ${version} does not match ${tag}`);
          }
          for (const file of ['apps/dashboard/build/index.html', versionFile]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Dashboard build did not produce ${file}`);
            }
          }
          NODE

      - name: Build
        run: cargo build --locked --package vestige-mcp --release --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-gnu/release
          tar -czf ../../../vestige-mcp-x86_64-unknown-linux-gnu.tar.gz vestige-mcp vestige vestige-restore

      - name: Check glibc ceiling
        run: bash scripts/check-linux-glibc.sh target/x86_64-unknown-linux-gnu/release/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: bash scripts/smoke-vestige-mcp.sh target/x86_64-unknown-linux-gnu/release/vestige-mcp

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-x86_64-unknown-linux-gnu
          path: vestige-mcp-x86_64-unknown-linux-gnu.tar.gz

  publish-linux:
    name: Smoke + publish x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Download linux-gnu artifact
        uses: actions/download-artifact@v4
        with:
          name: vestige-mcp-x86_64-unknown-linux-gnu
          path: dist

      - name: Extract
        run: tar -xzf dist/vestige-mcp-x86_64-unknown-linux-gnu.tar.gz -C dist

      - name: Check glibc ceiling
        run: bash scripts/check-linux-glibc.sh dist/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            ubuntu:22.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

      - name: Exec vestige-mcp on Debian 12 bookworm
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            debian:bookworm \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

      - name: Generate checksum
        working-directory: dist
        run: sha256sum vestige-mcp-x86_64-unknown-linux-gnu.tar.gz > vestige-mcp-x86_64-unknown-linux-gnu.tar.gz.sha256

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/vestige-mcp-x86_64-unknown-linux-gnu.tar.gz
            dist/vestige-mcp-x86_64-unknown-linux-gnu.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # aarch64 Linux asset (#240): the x86_64 job on GitHub's arm64 runner, same
  # Ubuntu 22.04 container for the glibc 2.35 floor, same checks and smokes.
  build-linux-arm64:
    name: Build aarch64-unknown-linux-gnu (glibc 2.35)
    runs-on: ubuntu-24.04-arm
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: bash -lc "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config cmake python3 perl xz-utils unzip binutils libssl-dev"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Add target to the pinned toolchain
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          if (!expected) {
            throw new Error('Release tag is empty');
          }

          const packageFiles = [
            'package.json',
            'apps/dashboard/package.json',
            'packages/vestige-init/package.json',
            'packages/vestige-mcp-npm/package.json'
          ];
          for (const file of packageFiles) {
            const actual = require(`./${file}`).version;
            if (actual !== expected) {
              throw new Error(`${file} version ${actual} does not match ${tag}`);
            }
          }

          const metadata = JSON.parse(execFileSync('cargo', [
            'metadata',
            '--format-version',
            '1',
            '--locked',
            '--no-deps'
          ], { encoding: 'utf8' }));
          for (const name of ['vestige-core', 'vestige-mcp']) {
            const pkg = metadata.packages.find((candidate) => candidate.name === name);
            if (!pkg) throw new Error(`Missing Cargo package ${name}`);
            if (pkg.version !== expected) {
              throw new Error(`${name} version ${pkg.version} does not match ${tag}`);
            }
          }
          NODE

      - name: Build embedded dashboard
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @vestige/dashboard check
          pnpm --filter @vestige/dashboard test
          pnpm --filter @vestige/dashboard build
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.RELEASE_TAG || '';
          const expected = tag.replace(/^refs\/tags\//, '').replace(/^v/, '');
          const versionFile = 'apps/dashboard/build/_app/version.json';
          const version = JSON.parse(fs.readFileSync(versionFile, 'utf8')).version;
          if (version !== expected) {
            throw new Error(`${versionFile} version ${version} does not match ${tag}`);
          }
          for (const file of ['apps/dashboard/build/index.html', versionFile]) {
            if (!fs.existsSync(file)) {
              throw new Error(`Dashboard build did not produce ${file}`);
            }
          }
          NODE

      - name: Build
        run: cargo build --locked --package vestige-mcp --release --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          cd target/aarch64-unknown-linux-gnu/release
          tar -czf ../../../vestige-mcp-aarch64-unknown-linux-gnu.tar.gz vestige-mcp vestige vestige-restore

      - name: Check glibc ceiling
        run: bash scripts/check-linux-glibc.sh target/aarch64-unknown-linux-gnu/release/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: bash scripts/smoke-vestige-mcp.sh target/aarch64-unknown-linux-gnu/release/vestige-mcp

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: vestige-mcp-aarch64-unknown-linux-gnu
          path: vestige-mcp-aarch64-unknown-linux-gnu.tar.gz

  publish-linux-arm64:
    name: Smoke + publish aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    needs: [build-linux-arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.inputs.tag || github.ref }}

      - name: Download linux-gnu artifact
        uses: actions/download-artifact@v4
        with:
          name: vestige-mcp-aarch64-unknown-linux-gnu
          path: dist

      - name: Extract
        run: tar -xzf dist/vestige-mcp-aarch64-unknown-linux-gnu.tar.gz -C dist

      - name: Check glibc ceiling
        run: bash scripts/check-linux-glibc.sh dist/vestige-mcp

      - name: Exec vestige-mcp on Ubuntu 22.04
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/dist:/opt/vestige:ro" \
            -v "$PWD/scripts:/opt/scripts:ro" \
            ubuntu:22.04 \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libstdc++6 >/dev/null && bash /opt/scripts/smoke-vestige-mcp.sh /opt/vestige/vestige-mcp'

      - name: Exec vestige-mcp on Debian 12 bookworm
        run: |
          docker run --rm --platform linux/arm64 \
