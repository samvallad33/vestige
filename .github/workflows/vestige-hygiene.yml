name: Vestige Memory Hygiene

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      commits:
        description: "Number of commits to scan for RETRACE oscillation hotspots"
        required: false
        default: "500"

permissions:
  contents: read
  issues: write

jobs:
  hygiene:
    name: Vestige Weekly Memory Hygiene & RETRACE Oscillation Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vestige-causal-gate

      - name: Build local Vestige CLI
        run: cargo build --release -p vestige-mcp --bin vestige

      - name: Run Deterministic Memory Hygiene & RETRACE Audit
        shell: bash
        env:
          COMMITS: ${{ github.event.inputs.commits || '500' }}
        run: |
          ./target/release/vestige hygiene \
            --repo "$GITHUB_WORKSPACE" \
            --commits "$COMMITS" \
            --markdown \
            --out vestige-hygiene.md
          ./target/release/vestige churn-map \
            --repo "$GITHUB_WORKSPACE" \
            --commits "$COMMITS" \
            --out vestige-churn-map.svg
          cat vestige-hygiene.md

      - name: Upload RETRACE Code Churn Heatmap SVG Artifact
        if: hashFiles('vestige-churn-map.svg') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vestige-churn-map
          path: vestige-churn-map.svg
          retention-days: 30

      - name: Create or update pinned Weekly Hygiene Report Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('vestige-hygiene.md', 'utf8');
            const marker = '<!-- vestige-hygiene -->';
            const title = '🧹 Vestige Weekly Memory Hygiene & RETRACE Oscillation Report';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
