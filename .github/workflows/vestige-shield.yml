name: Vestige Shield

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: vestige-shield-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  concealment-and-biba-shield:
    name: Vestige Concealment & Biba Integrity Shield
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: vestige-causal-gate

      - name: Build local Vestige CLI
        run: cargo build --release -p vestige-mcp --bin vestige

      - name: Run Deterministic Unicode Concealment, Secret & Biba Integrity Audit
        id: shield
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          ./target/release/vestige shield \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --markdown \
            --out vestige-shield.md \
            --sarif-out vestige-shield.sarif \
            --fail-on-finding
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          cat vestige-shield.md
          exit 0

      - name: Upload SARIF to GitHub Code Scanning (Inline PR Diff Annotations)
        if: always() && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('vestige-shield.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: vestige-shield.sarif
          category: vestige-shield

      - name: Post or update Vestige Shield Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('vestige-shield.md', 'utf8');
            const marker = '<!-- vestige-shield -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce Concealment & Secret Gate
        if: steps.shield.outputs.exit_code != '0'
        run: |
          echo "::error::Vestige Shield blocked this PR: invisible Unicode smuggling, Trojan Bidi override, or secret pattern detected."
          exit 1
