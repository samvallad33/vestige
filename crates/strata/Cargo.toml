[package]
name = "strata"
version = "6.0.1"
edition = "2021"
description = "Strata: append-only, fail-stop write-ahead log with hash-chained, signed segments"
license = "AGPL-3.0-only"
publish = false

# Intentionally standalone: the empty [workspace] table keeps this crate out of
# the repository root workspace so it builds and tests on its own. Integration
# wiring removes this table (and adds the crate to the root members) later.
[workspace]

[dependencies]
# borsh >= 1.6 ships derive macros behind an opt-in feature.
borsh = { version = "1", features = ["derive"] }
blake3 = "1.8"
ed25519-dalek = "3"
# OS CSPRNG for the log signing seed and ids on every platform, so the
# Windows path is the same code CI exercises on unix.
getrandom = "0.4"

# Unix-only: libc provides fcntl(F_FULLFSYNC) on macOS and kill(pid, 0) for the
# stale single-writer lock probe; neither is reachable from std.
[features]
# Test-only fault injection (simulated full disk). Off by default; the store's
# integration tests enable it through a dev-dependency.
failpoints = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
