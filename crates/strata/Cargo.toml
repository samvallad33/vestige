[package]
name = "strata"
version = "0.1.0"
edition = "2021"
description = "Strata: append-only, fail-stop write-ahead log with hash-chained, signed segments"
license = "AGPL-3.0-only"
publish = false

[dependencies]
# borsh >= 1.6 ships derive macros behind an opt-in feature.
borsh.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true

# Unix-only: libc provides fcntl(F_FULLFSYNC) on macOS and kill(pid, 0) for the
# stale single-writer lock probe; neither is reachable from std.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
