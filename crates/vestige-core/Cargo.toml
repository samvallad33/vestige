[package]
name = "vestige-core"
version = "4.1.1"
edition = "2024"
rust-version = "1.91"
authors = ["Vestige Team"]
description = "Vestige core engine: FSRS-6 scheduling and temporal records for the Causal Proof Engine"
license = "AGPL-3.0-only"
repository = "https://github.com/samvallad33/vestige"
# crates.io already has this name under conorluddy/Vestige. Do not publish.
publish = false
keywords = ["memory", "spaced-repetition", "fsrs", "knowledge-graph"]
categories = ["science", "database"]

[features]
default = ["codebase-git"]

# LEGACY SQLITE QUARANTINE (build/t5-legacy-isolation).
#
# Every line of SQLite code lives behind this feature: the
# `storage/sqlite/` module tree, the rusqlite-dependent sibling modules in
# `storage/` (edges, blast, session_queries, trace_store, portable, ...),
# `fts.rs` (SQLite FTS5 query sanitization), the `Storage =
# SqliteMemoryStore` alias, and the `SqliteMemoryStore::new` constructor
# path. Default ON for now; the flip to default-off happens after the
# STRATA migration lands. Code outside this boundary must not name
# rusqlite; open `Storage` handles through `storage::open_storage()`,
# which fails with a clear error when this feature is off.
legacy-sqlite = ["dep:rusqlite"]

# Raw v3-engine test harness (PR 0a): builds the legacy engine WITHOUT the
# v3 read-write guard, for the engine's own restart/durability unit tests
# and the migration fixture tooling, which legitimately reopen synthetic
# stores. Off by default; the shipped binary never enables it, so no
# shipped path can open a v3 SQLite file read-write.
v3-engine = ["legacy-sqlite"]

# SQLite backend (default, unencrypted)
bundled-sqlite = ["legacy-sqlite", "rusqlite/bundled"]

# Git history analysis for codebase memory. Pulls git2 + libgit2, which drag
# OpenSSL and libssh2 into the build. On by default. Off for targets where
# those C libraries are the difference between a binary and no binary
# (Android/Termux, #145): the codebase tool then answers "git history is not
# available in this build" instead of failing to build.
codebase-git = ["dep:git2"]

# Encrypted SQLite via SQLCipher (mutually exclusive with bundled-sqlite)
# Use: --no-default-features --features encryption,bundled-sqlite
# Set VESTIGE_ENCRYPTION_KEY env var to enable encryption
encryption = ["legacy-sqlite", "rusqlite/bundled-sqlcipher"]

# ---------------------------------------------------------------------------
# DEPRECATED NO-OP STUBS (vector/embedding removal).
#
# The embedding generation (embeddings/, embedder/), HNSW vector index
# (search/vector.rs), reranker, and HyDE modules were removed. These feature
# names remain as EMPTY stubs ONLY because manifests outside this crate's
# current change scope still forward/reference them and cargo fails workspace
# resolution if a forwarded feature does not exist:
#   - crates/vestige-mcp/Cargo.toml (embeddings, vector-search, ort-download,
#     ort-dynamic, qwen3-embeddings, metal, cuda, cudnn)
#   - tests/e2e/Cargo.toml (embeddings, vector-search)
# They enable no code or dependencies. Rust cfg sites use the unset
# `vestige_embeddings_removed` cfg, not these feature names, so
# `--all-features` does not compile the deleted embedding paths.
# Delete the stubs together with the forwarded names. See SCOPE-HANDOFF.md.
# ---------------------------------------------------------------------------
embeddings = []
vector-search = []
ort-download = []
ort-dynamic = []
qwen3-embeddings = []
metal = []
cuda = []
cudnn = []

# External-source connectors (#57). The connector *contract*, normalization,
# and content-hashing are always compiled (pure, no network). This feature adds
# the network-backed reference connectors (GitHub Issues, …) via `reqwest`, so
# the default local-first build never links an HTTP client.
connectors = ["dep:reqwest"]

# Hosted managed-sync backend (Vestige Cloud). Adds the HTTP `PortableSyncBackend`
# (`HttpPortableSyncBackend`) that pull-merge-pushes the portable archive to a
# hosted blob endpoint over HTTPS with a per-user sync key. Like `connectors`,
# this is the ONLY thing that links an HTTP client — the default local-first
# build stays network-free. Uses `reqwest`'s blocking client because the
# `PortableSyncBackend` trait methods are synchronous.
cloud-sync = ["dep:reqwest", "reqwest/blocking", "dep:chacha20poly1305", "dep:argon2"]


[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
base64 = "0.23"
ed25519-dalek = "3"

# Date/Time with full timezone support
chrono = { version = "0.4", features = ["serde"] }

# UUID v4 generation
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"

# Database - SQLite with FTS5 full-text search and JSON
# Note: "bundled" or "bundled-sqlcipher" added via feature flags above.
# Optional: present only in `legacy-sqlite` builds (see feature block).
rusqlite = { version = "0.40", features = ["chrono", "serde_json"], optional = true }

# Platform-specific directories
directories = "6"

# Async runtime (required for codebase module; `time` backs connector backoff)
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }

# Tracing for structured logging
tracing = "0.1"

# Git integration for codebase memory (feature `codebase-git`, default on)
# vendored-openssl: Compile OpenSSL from source for cross-compilation support
git2 = { version = "0.21", features = ["vendored-openssl"], optional = true }

# File watching for codebase memory
notify = "8"

trait-variant = "0.1"
blake3 = "1"
sha2 = "0.11"

# ============================================================================
# OPTIONAL: External-source connectors (#57)
# ============================================================================
# HTTP client for network-backed reference connectors (GitHub Issues, Redmine).
# rustls so connectors build with no system OpenSSL dependency. Behind the
# `connectors` feature — the default local-first build does not link reqwest.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"], optional = true }

# ============================================================================
# OPTIONAL: Zero-knowledge client-side encryption for Vestige Cloud sync
# ============================================================================
# XChaCha20-Poly1305 AEAD + Argon2id passphrase KDF. The archive is encrypted on
# the client before upload, so the hosted service only ever stores ciphertext.
# Behind the `cloud-sync` feature — the default local-first build links neither.
chacha20poly1305 = { version = "0.11", optional = true }
argon2 = { version = "0.6", optional = true }
# System CSPRNG for salt/nonce material (rand_core 0.10 dropped OsRng).
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"

[lib]
name = "vestige_core"
path = "src/lib.rs"

# Enable doctests
doctest = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vestige_embeddings_removed)"] }
