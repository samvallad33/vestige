[package]
name = "vestige-upgrade"
version = "4.1.1"
edition = "2024"
description = "One-shot v3 SQLite to Strata upgrade. The only Vestige binary that links SQLite."
authors = ["samvallad33"]
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "vestige-upgrade"
path = "src/main.rs"

[dependencies]
libc = "0.2"
directories = "6"
# The only product binary that turns on the read-only SQLite reader.
strata-migrate = { path = "../strata-migrate", features = ["sqlite-reader"] }
# v3 intentions have no migration frame. They are admitted into the staged
# log through the store's own UpsertIntentions path before the rename.
strata-store = { path = "../strata-store" }
strata-verify = { path = "../strata-verify" }
vestige-core = { path = "../vestige-core", default-features = false }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
tempfile = "3"
strata = { path = "../strata" }
strata-migrate = { path = "../strata-migrate", features = ["sqlite-reader"] }
strata-verify = { path = "../strata-verify" }
