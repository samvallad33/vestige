[package]
name = "strata-gate"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Strata gate runtime: the model proposes, the deterministic checker decides; change+verdict land as one signed record"
publish = false

# Standalone crate by design: it must NOT join the vestige root workspace.
# Integration re-parents it deliberately, never implicitly.

[dependencies]
# borsh >= 1.8 no longer enables `derive` by default.
borsh.workspace = true
blake3.workspace = true
