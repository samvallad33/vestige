[package]
name = "vestige-mcp"
version = "3.1.1"
edition = "2024"
description = "Cognitive memory MCP server for AI agents - FSRS-6, spreading activation, synaptic tagging, 3D dashboard, and 130 years of memory research"
authors = ["samvallad33"]
license = "AGPL-3.0-only"
keywords = ["mcp", "ai", "memory", "fsrs", "neuroscience", "cognitive-science", "spaced-repetition"]
categories = ["command-line-utilities", "database"]
repository = "https://github.com/samvallad33/vestige"
# crates.io already has this name under conorluddy/Vestige. Do not publish.
publish = false
autobins = false

[features]
# The shipped binaries boot a Strata log. A v3 file is imported by the separate
# `vestige-upgrade` binary, which is the only one that links rusqlite.
# `migrate-to-strata` stays available for an explicit rebuild of the CLI
# subcommands. Connectors and cloud-sync stay off so the default graph does
# not link reqwest. `legacy-sqlite` stays off the shipped graph.
default = ["codebase-git"]
# LEGACY SQLITE QUARANTINE (build/t5-legacy-isolation), mirroring
# vestige-core. Gates every Storage/sqlite-touching module (server, tools,
# dashboard, cognitive, resources, trace_recorder, autopilot,
# actor_surface), this crate's own rusqlite use (backup WAL checkpoint),
# and forwards to vestige-core's `legacy-sqlite` + `bundled-sqlite`.
# Off by default. Unit tests and the v3-engine harness opt in.
legacy-sqlite = ["vestige-core/legacy-sqlite", "vestige-core/bundled-sqlite", "dep:rusqlite"]
# Explicit `vestige migrate-to-strata` rebuild. Not linked into the default
# binaries. The shipped import is `vestige-upgrade`. `sqlite-reader` is the
# edge that links bundled rusqlite. `strata-verify` stays a direct dependency
# and does not enable that reader.
migrate-to-strata = ["dep:strata-migrate", "strata-migrate/sqlite-reader"]
# Raw engine test harness for THIS crate's own test builds (feature-gated
# restart/creation tests). Never in default; the shipped binary keeps the
# guard + creation block armed.
v3-engine = ["legacy-sqlite", "vestige-core/v3-engine"]
# w1b vector removal: `embeddings` and `vector-search` no longer select any
# dependencies. They stay declared so manifests that still forward the names
# resolve. Code does not key off them (`vestige_embeddings_removed` is an
# unset cfg), so `--all-features` does not compile the deleted paths.
embeddings = []
vector-search = []
# Same empty stubs. Release cargo flags still name them (`ort-download` on
# Windows, `ort-dynamic` on Intel Mac). They select no crates.
ort-download = []
ort-dynamic = []
# Git history for the codebase tool (libgit2, OpenSSL, libssh2). On by default;
# off for Android/Termux builds (#145), where the tool reports git history as
# unavailable instead of the build failing on those C libraries.
codebase-git = ["vestige-core/codebase-git"]
# External-source connectors (#57): GitHub Issues / Redmine indexing via the
# `source_sync` MCP tool. Not a 4.0 default. Enable with `--features connectors`.
# Off, `source_sync` is absent from tools/list and dispatch.
connectors = ["vestige-core/connectors"]
# Hosted managed-sync (Vestige Cloud): `vestige sync --cloud` pushes/pulls the
# portable archive to the hosted blob service. Not a 4.0 default. Enable with
# `--features cloud-sync`.
cloud-sync = ["vestige-core/cloud-sync"]

# Fails on targets without prebuilts (notably x86_64-apple-darwin).
# Published linux-gnu binaries are built in Ubuntu 22.04 (glibc 2.35) so they
# start on 22.04 and Debian 12; see vestige-core's isoc23 shim.
# Alternative ort backend: runtime-linked system libonnxruntime via dlopen.
# Required on Intel Mac (no x86_64 prebuilts).
# Usage:   cargo build --no-default-features --features ort-dynamic,vector-search
# Runtime: export ORT_DYLIB_PATH=$(brew --prefix onnxruntime)/lib/libonnxruntime.dylib
# CUDA GPU acceleration on NVIDIA hardware (Windows / Linux, x86_64 + aarch64).
# Pairs with `qwen3-embeddings`; see vestige-core Cargo.toml.

[[bin]]
name = "vestige-mcp"
path = "src/main.rs"

[[bin]]
name = "vestige-restore"
path = "src/bin/restore.rs"

[[bin]]
name = "vestige"
path = "src/bin/cli.rs"

[dependencies]
# ============================================================================
# VESTIGE CORE - The cognitive science engine
# ============================================================================
# Includes: FSRS-6, spreading activation, synaptic tagging, hippocampal indexing,
# memory states, context memory, importance signals, dreams, and more.
#
# Only `bundled-sqlite` used to be hardcoded here; it now arrives via the
# `legacy-sqlite` feature so `--no-default-features` builds a sqlite-free
# crate (build/t5-legacy-isolation). `embeddings` and `vector-search` are
# always-off stubs (w1b).
vestige-core = { version = "3.0.0", path = "../vestige-core", default-features = false }

# One-shot SQLite -> STRATA migration. Optional, and not in the default
# feature set. `default-features = false` keeps `sqlite-reader` off until
# `migrate-to-strata` asks for it. The shipped importer is `vestige-upgrade`.
strata-migrate = { path = "../strata-migrate", optional = true, default-features = false }
# Log and receipt verification. Does not enable `sqlite-reader`, so the
# default `vestige strata-verify` command stays in the binary.
strata-verify = { path = "../strata-verify" }

# Strata log the shipped MCP server boots. Workspace-excluded; path dep only.
strata-store = { path = "../strata-store" }
# Gate policy type for projection admission. No SQLite.
strata-gate = { path = "../strata-gate" }
blake3 = "1"

# ============================================================================
# MCP Server Dependencies
# ============================================================================
# Async runtime
tokio = { version = "1", features = ["full", "io-std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unicode-normalization = "0.1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Derives the public half of an operator-provisioned receipt signing seed
# before it is allowed to sign against the separately registered key record.
ed25519-dalek = "3"

# Constant-time comparison for auth tokens (prevents timing side-channels)
subtle = "2"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Platform directories
directories = "6"

# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"

# SQLite (for backup WAL checkpoint) — only in `legacy-sqlite` builds
# (build/t5-legacy-isolation).
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

# Dashboard (v2.0) - HTTP server + WebSocket + embedded SvelteKit
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "ws"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["cors", "set-header"] }
futures-util = "0.3"
open = "5"

# Embedded SvelteKit dashboard (v2.0)
include_dir = "0.7"
mime_guess = "2"

tempfile = "3"
libc = "0.2"

[dev-dependencies]
blake3 = "1"
ctor = "0.4"
# rusqlite is the optional normal dependency above. `legacy-sqlite` enables it,
# and the sqlite integration tests require that feature. A dev-dependency would
# put SQLite on the default feature graph.
sha2 = "0.11"
tempfile = "3"
serde_json = "1"
strata-store = { path = "../strata-store" }

# Integration tests drive the Storage-backed server/tools; the e2e binary
# test also reads the SQLite file directly (backup WAL). Skipped in a
# legacy-sqlite-free build (build/t5-legacy-isolation). NO v3-engine here:
# the guard must be armed in test builds too (audit finding: a fresh install
# created a SQLite store and then refused to open it, invisible while the
# guard was test-disabled).
[[test]]
name = "backfill_trait_wall"
required-features = ["legacy-sqlite"]

[[test]]
name = "e2e_failure_cases"
required-features = ["legacy-sqlite"]

[[test]]
name = "e2e_real_binary"
required-features = ["legacy-sqlite"]

[[test]]
name = "stdio_shutdown"
required-features = ["legacy-sqlite"]

[[test]]
name = "views_sized_store"
required-features = ["legacy-sqlite"]

[[test]]
name = "imported_graph_stdio"
required-features = ["legacy-sqlite", "migrate-to-strata"]

[[test]]
name = "retire_policy_stdio"
required-features = ["migrate-to-strata"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(vestige_embeddings_removed)"] }
