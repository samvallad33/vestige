[package]
name = "vestige-h2sk-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Portable read-only H2SK admission, packet and output-gate adapter"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
libm = "0.2"
wasm-bindgen = "=0.2.129"
