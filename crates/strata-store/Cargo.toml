[package]
name = "strata-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
description = "STRATA-native memory store: StrataLog as the append-only source of truth, gate-admitted writes, kernel-folded FSRS"
publish = false

# Standalone on purpose: this crate keeps its own (empty) workspace table so
# it does NOT join the vestige root workspace while the sibling strata crates
# are being integrated by parallel agents. Re-parent deliberately, never
# implicitly.
[workspace]

[dependencies]
strata = { path = "../strata" }
strata-kernel = { path = "../strata-kernel" }
strata-gate = { path = "../strata-gate" }
# Migration frames share kind bytes 0x20/0x21 with store writes. Replay
# decodes the existing migration records; it does not invent a StoreOp.
# Record types only: without default-features the SQLite reader (rusqlite)
# stays out of every binary that links the store.
strata-migrate = { path = "../strata-migrate", default-features = false }
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
# Canonical content identity (NFC pipeline) for the duplicate gate. Version
# pinned to vestige-mcp's so both crates compose text identically.
unicode-normalization = "0.1"

[dev-dependencies]
# Fault injection for the full-disk tests (a simulated ENOSPC on log writes).
strata = { path = "../strata", features = ["failpoints"] }
# The replay tests import a v3 fixture through the real importer.
strata-migrate = { path = "../strata-migrate", features = ["sqlite-reader"] }
