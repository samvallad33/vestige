[package]
name = "strata-migrate"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "One-shot migration tool: empties the Vestige SQLite store into a STRATA log"
publish = false

# Standalone on purpose: the empty [workspace] table keeps this crate out of
# the root vestige workspace while the strata crates are being integrated by
# parallel agents (same pattern as crates/strata, crates/strata-kernel, and
# crates/strata-gate). Drop this table when the integration lands.
[workspace]

[features]
# SQLite source reader. Default for this crate's own test and bin builds.
# Dependents that must not link rusqlite use `default-features = false`.
# `vestige-upgrade` and an explicit `migrate-to-strata` rebuild turn it on.
default = ["sqlite-reader"]
# Importer's read-only v3 reader (`source::open_readonly`). This is the only
# gate for checking a log against a source SQLite store. Not a store-open
# or write path.
sqlite-reader = ["dep:rusqlite"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
blake3 = "1"
# MIGRATION_RECEIPT signatures (non-derivable key, verified via the public
# key recorded in the log).
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tempfile = "3"
# DSSE payload/signature decoding for the receipt_envelopes chain check.
base64 = "0.22"
# Fixture generator bin error type.
anyhow = "1"
# Read-only source reader (mode=ro&immutable=1 URI). Optional: log and
# receipt checks compile without it. Same version/features as vestige-core
# so a migrate build unifies to one bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

strata = { path = "../strata" }
strata-kernel = { path = "../strata-kernel" }
# NO sqlite features here — deliberately. Enabling bundled-sqlite would
# unify legacy-sqlite into the vestige-mcp binary build, so a fresh install
# created a SQLite store and then refused to open it (audit finding 1). The
# migrator reads sources through its OWN rusqlite connection and declares
# the portable-format constant locally; vestige-core (ungated) supplies the
# portable types and the DSSE digest functions.
# Do not enable `connectors` or `cloud-sync` on this edge either. vestige-mcp
# pulls this crate through `migrate-to-strata`, and Cargo unifies vestige-core
# features across that edge — either feature would link reqwest into the binary.
vestige-core = { path = "../vestige-core", default-features = false }

# `rusqlite` above is also used by tests to plant synthetic fixture rows.

[dev-dependencies]
# Fixture tooling builds synthetic v3 stores through the real migration
# path; test builds only — never unified into the shipped binary.
# default-features stays off so a future vestige-core default cannot unify
# `connectors` into this test build. `codebase-git` is the current core default
# and is named explicitly so the test graph does not depend on that default.
vestige-core = { path = "../vestige-core", default-features = false, features = ["codebase-git", "bundled-sqlite", "v3-engine"] }

[[bin]]
name = "make-v3-fixture"
path = "src/bin/make-v3-fixture.rs"
required-features = ["sqlite-reader"]
