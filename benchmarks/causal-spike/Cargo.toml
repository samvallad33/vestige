[package]
name = "causal-spike"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Preregistered v3.0 causal-graph spike harness (docs/v3/CAUSAL-SPIKE-PROTOCOL.md)"

[dependencies]
vestige-core = { path = "../../crates/vestige-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
